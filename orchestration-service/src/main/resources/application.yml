server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: orchestration-service

  autoconfigure:
    exclude:
      # PgVectorStoreAutoConfiguration requires an EmbeddingModel bean. The custom Voyage
      # EmbeddingModel wrapper (ADR-025 — no native Spring AI Voyage provider exists) is
      # Week 1 business logic, out of scope for Day 5 scaffolding. The Maven dependency stays
      # on the classpath; remove this exclusion once that wrapper bean exists.
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      # D-060: do not create a Bolt Driver on AppSail (blackholed 7687 → cold-start 408).
      # Keep these as YAML list entries only — do not override spring.autoconfigure.exclude
      # from Java (CSV PropertySource broke PgVector exclude → boot crash / Catalyst 503).
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration

  neo4j:
    # TEMPORARY (2026-07-20, MVP-1 only): aparadhkavach-dev's NEO4J_URI/USERNAME/PASSWORD
    # env vars are pointed at the staging Aura instance rather than a dev-only graph, bending
    # the staging/production Neo4j isolation principle. No URI is hardcoded here — the actual
    # value lives in the dev environment's externalized config. Revert to a dedicated dev
    # instance post-MVP-1-submission.
    #
    # Aura Free (24 Jul 2026): user DB is often the instance id (e.g. 601ef9b9), not "neo4j".
    # Set NEO4J_DATABASE to match neo4j_populate.py --database / SHOW DATABASES (D-043).
    uri: ${NEO4J_URI:bolt://localhost:7687}
    database: ${NEO4J_DATABASE:neo4j}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:local-dev-placeholder}

  datasource:
    url: ${PGVECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:local-dev-placeholder}
    hikari:
      # No live PgVector instance in local scaffold verification — don't fail startup
      # trying to open a connection pool against it.
      initialization-fail-timeout: -1
      # D-064: keep one idle JDBC connection so cold similarCases does not pay pool+TLS setup
      # inside the AppSail request budget.
      minimum-idle: ${PGVECTOR_HIKARI_MIN_IDLE:1}
      maximum-pool-size: ${PGVECTOR_HIKARI_MAX_POOL:5}
      connection-timeout: ${PGVECTOR_HIKARI_CONNECTION_TIMEOUT_MS:10000}

  ai:
    # One attempt only — hung Anthropic + retry would stack past AppSail ~30s (408).
    retry:
      max-attempts: 1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:local-dev-placeholder-not-a-real-key}
      chat:
        options:
          model: ${CLAUDE_MODEL:claude-sonnet-4-6}
    vectorstore:
      pgvector:
        index-type: IVFFLAT
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}

aparadhkavach:
  environment: ${APP_ENV:local}
  # Investigation HTTP for Q&A accused context (mvp2/11). Prefer over Orch DataStore theft.
  investigation:
    base-url: ${INVESTIGATION_SERVICE_URL:http://localhost:8081}
  # Claude Q&A prompt (mvp2/11). Change jurisdiction (or the whole system-prompt) per state deploy —
  # no Java edit required. Placeholder {jurisdiction} is substituted at runtime.
  query:
    jurisdiction: ${QUERY_JURISDICTION:Karnataka}
    # mvp2/12 Step D — bounded conversation history in Claude prompt
    history-max-turns: ${QUERY_HISTORY_MAX_TURNS:6}
    history-max-chars: ${QUERY_HISTORY_MAX_CHARS:2500}
    history-max-turn-chars: ${QUERY_HISTORY_MAX_TURN_CHARS:400}
    system-prompt: |
      You are AparadhKavach investigator assist for {jurisdiction} Police.
      Answer ONLY from the CONTEXT block. Do not invent FIR numbers, accused ids, names, scores, or relationships.
      If a PRIOR_TURNS block is present, use it only for conversational continuity (what the officer asked before).
      Do not treat PRIOR_TURNS as evidence. Cite entity/FIR ids only when they appear in CONTEXT.
      If context is insufficient, say so clearly and keep confidenceScore low.
      Cite entity and FIR ids that appear in CONTEXT.
      Write the answer field as 2–4 short paragraphs separated by blank lines (one idea per paragraph).
      Use plain officer language. Never say "CONTEXT", "CONTEXT graph", "Neo4j", "PRIOR_TURNS", or "1-hop".
      Prefer "linked case records" or "available case records" when referring to the assembled facts.
      For places, write human labels (e.g. "Mandya market area") — never SCREAMING_SNAKE codes like MARKET_AREA.
      Respond with ONLY valid JSON (no markdown fences, no prose before/after) using exactly these keys:
        answer (string — multi-paragraph with \\n\\n between paragraphs),
        evidenceSources (array of strings — ids from CONTEXT; may be empty if none apply),
        relatedFirs (array of strings),
        relatedEntities (array of objects with id, type, label — label must be human-readable),
        confidenceScore (number 0..1),
        reasoningSummary (string — short; plain language; no stack jargon).
      Do not use snake_case key names.
  sarvam:
    stt-url: ${SARVAM_STT_URL:http://localhost:8000}
  vector:
    top-k: ${VECTOR_TOP_K:5}
    max-top-k: ${VECTOR_MAX_TOP_K:10}
    # Async boot warm (SimilarStartupProbe) — same demo FIR as keep-warm / D-064.
    warmup-fir-id: ${VECTOR_WARMUP_FIR_ID:FIR-003276}
  graph:
    # D-060: AppSail blackholes outbound Bolt 7687 (requests hang → Catalyst 408), so the
    # network endpoint talks to Aura via the HTTPS Query API (443) by default. Set
    # GRAPH_TRANSPORT=bolt for local driver-based access.
    transport: ${GRAPH_TRANSPORT:http}
    traversal-depth: ${GRAPH_TRAVERSAL_DEPTH:3}
    network-default-depth: ${GRAPH_NETWORK_DEFAULT_DEPTH:1}
    network-max-depth: ${GRAPH_NETWORK_MAX_DEPTH:2}
    network-max-nodes: ${GRAPH_NETWORK_MAX_NODES:50}
    # Async boot warm (NetworkStartupProbe) — same rehearsal accused as keep-warm / D-063.
    warmup-entity-id: ${GRAPH_WARMUP_ENTITY_ID:ACC-00044}
  resilience:
    circuit-breaker-threshold: ${CIRCUIT_BREAKER_THRESHOLD:3}
  # Voyage AI (ADR-025) — no native Spring AI provider exists yet, so these aren't under
  # spring.ai.* like the Anthropic block below. Consumed by the custom EmbeddingModel
  # wrapper once that Week 1 business logic lands (not implemented yet).
  voyage:
    api-key: ${VOYAGE_API_KEY:local-dev-placeholder-not-a-real-key}
    embedding-model: ${EMBEDDING_MODEL:voyage-3-large}

# Catalyst DataStore (FIR/context assembly for Claude AI Bridge) — Self Client OAuth creds
# for local/external SDK access (External Services guide). Unused inside a deployed AppSail
# context, where the SDK auto-initializes from the execution context.
catalyst:
  project-id: ${CATALYST_PROJECT_ID:local-dev-placeholder}
  zaid: ${CATALYST_ZAID:local-dev-placeholder}
  client-id: ${CATALYST_CLIENT_ID:local-dev-placeholder}
  client-secret: ${CATALYST_CLIENT_SECRET:local-dev-placeholder-not-a-real-key}
  refresh-token: ${CATALYST_REFRESH_TOKEN:local-dev-placeholder-not-a-real-key}
  environment: ${CATALYST_ENVIRONMENT:Development}

# OpenTelemetry: instrumentation stays on the classpath, but export is OFF by default so we
# never spam ConnectException when no OTLP collector is reachable (e.g. AppSail has none at
# localhost:4318). To ship telemetry, set OTEL_*_EXPORTER=otlp + OTEL_EXPORTER_OTLP_ENDPOINT
# to a real collector. See Auto/16-Observability-Operations-Implementation.md.
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-orchestration-service}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
