server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway-service
  # Gateway only forwards raw bytes (DownstreamProxy). If multipart stays enabled,
  # DispatcherServlet parses FormData before the proxy runs → empty body to Orch
  # → Safari ChatPanel Mic fails with opaque "did not match the expected pattern".
  servlet:
    multipart:
      enabled: false

aparadhkavach:
  environment: ${APP_ENV:local}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:local-dev-placeholder-not-a-real-key}

downstream:
  investigation-service-url: ${INVESTIGATION_SERVICE_URL:http://localhost:8081}
  analytics-service-url: ${ANALYTICS_SERVICE_URL:http://localhost:8082}
  orchestration-service-url: ${ORCHESTRATION_SERVICE_URL:http://localhost:8083}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8085}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-api-gateway-service}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
