server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway-service

aparadhkavach:
  environment: ${APP_ENV:local}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:local-dev-placeholder-not-a-real-key}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-api-gateway-service}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp

logging:
  level:
    root: ${LOG_LEVEL:INFO}
