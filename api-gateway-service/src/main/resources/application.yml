server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway-service

aparadhkavach:
  environment: ${APP_ENV:local}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:local-dev-placeholder-not-a-real-key}

# Downstream Spring Boot service URLs — environment-driven (ADR-022). Feature 1 routes
# /v1/accusedPersons/** → Investigation and /v1/analytics/** → Analytics.
downstream:
  investigation-service-url: ${INVESTIGATION_SERVICE_URL:http://localhost:8081}
  analytics-service-url: ${ANALYTICS_SERVICE_URL:http://localhost:8082}

# aparadhkavach-client's origin(s), comma-separated. Local default is the Vite dev server
# port used by DeployPathCheck; staging/prod set their own Slate origin(s) via this same var
# (ADR-022) - never wildcarded, since requests carry an Authorization header (CorsConfig).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-api-gateway-service}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp

logging:
  level:
    root: ${LOG_LEVEL:INFO}
