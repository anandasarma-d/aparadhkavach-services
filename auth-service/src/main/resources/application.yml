server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service

aparadhkavach:
  environment: ${APP_ENV:local}
  auth:
    # Bootstrap only (mvp2/10). Set true on Lane B until Catalyst Embedded exchange is wired.
    allow-dev-mint: ${AUTH_ALLOW_DEV_MINT:true}
  jwt:
    # RSA PKCS#8 PEM. Use \n for single-line AppSail env values.
    private-key: ${JWT_PRIVATE_KEY:local-dev-placeholder-not-a-real-key}
    # Same keypair public half — required for GET /v1/auth/me verification.
    public-key: ${JWT_PUBLIC_KEY:local-dev-placeholder-not-a-real-key}
    expiry-hours: ${JWT_EXPIRY_HOURS:1}

catalyst:
  project-id: ${CATALYST_PROJECT_ID:local-dev-placeholder}
  zaid: ${CATALYST_ZAID:local-dev-placeholder}
  client-id: ${CATALYST_CLIENT_ID:local-dev-placeholder}
  client-secret: ${CATALYST_CLIENT_SECRET:local-dev-placeholder-not-a-real-key}
  refresh-token: ${CATALYST_REFRESH_TOKEN:local-dev-placeholder-not-a-real-key}
  environment: ${CATALYST_ENVIRONMENT:Development}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-auth-service}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
