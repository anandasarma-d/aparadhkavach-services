server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: analytics-service

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:local-dev-placeholder}

aparadhkavach:
  environment: ${APP_ENV:local}
  quickml:
    endpoint: ${QUICKML_ENDPOINT:http://localhost:9000}
  hotspot:
    alert-threshold: ${HOTSPOT_ALERT_THRESHOLD:0.70}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  service:
    name: ${SERVICE_NAME:aparadhkavach-analytics-service}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp

logging:
  level:
    root: ${LOG_LEVEL:INFO}
